name: Build Cloup APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      APP_ID: com.cloup.app
      APP_NAME: Cloup

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install Capacitor
        run: |
          npm init -y
          npm install @capacitor/core@6 @capacitor/cli@6 @capacitor/android@6 @capacitor-community/contacts@6

      - name: Prepare web files
        run: |
          mkdir -p www
          cp index.html app.js app-scanner.js style.css www/
          for f in *.png *.jpg *.svg *.webp; do
            [ -f "$f" ] && cp "$f" www/ || true
          done

      - name: Create Android project
        run: |
          npx cap init "$APP_NAME" "$APP_ID" --web-dir www
          npx cap add android

      - name: Add native plugin and MainActivity
        run: |
          PKG_DIR="android/app/src/main/java/$(echo $APP_ID | tr . /)"
          mkdir -p "$PKG_DIR"
          cp AppScannerPlugin.java MainActivity.java "$PKG_DIR/"

      - name: Add queries to AndroidManifest
        run: |
          python3 - << 'PY'
          import re
          add = open('AndroidManifest-additions.xml', encoding='utf-8').read()
          block = re.search(r'<queries>.*?</queries>', add, re.S).group(0)
          p = 'android/app/src/main/AndroidManifest.xml'
          m = open(p, encoding='utf-8').read()
          perm = '<uses-permission android:name="android.permission.READ_CONTACTS" />'
          if '<queries>' not in m:
              m = m.replace('<application', block + '\n    <application', 1)
          if 'READ_CONTACTS' not in m:
              m = m.replace('<application', perm + '\n    <application', 1)
          open(p, 'w', encoding='utf-8').write(m)
          PY

      - name: Sync web files
        run: npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: cloup-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
